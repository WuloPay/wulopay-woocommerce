# Local WordPress + WooCommerce with this plugin mounted, for development and testing.
#   docker compose -f dev/docker-compose.yml up -d && sh dev/setup.sh
# Store: http://localhost:8088 (admin / admin). The sandbox accepts http://localhost return URLs.
# Webhooks can't reach localhost; the plugin confirms payments when the shopper returns, or use a tunnel.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_RANDOM_ROOT_PASSWORD: '1'
    volumes: [db:/var/lib/mysql]
  wordpress:
    image: wordpress:php8.4-apache
    depends_on: [db]
    ports: ['8088:80']
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: '1'
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/wulopay-woocommerce:ro
  cli:
    image: wordpress:cli-php8.4
    depends_on: [wordpress]
    user: '33:33'
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/wulopay-woocommerce:ro
    entrypoint: ['wp']
    profiles: [cli]
volumes:
  db:
  wp:
